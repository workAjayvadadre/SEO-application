# /etc/nginx/sites-available/keyword-studio  (or /etc/nginx/conf.d/keyword-studio.conf)
# Replace server_name with your UAT domain, and the port if you changed KEYWORD_STUDIO_PORT.
server {
    listen 80;
    server_name seo-uat.example.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Campaign planner / regional research call Claude + web search and can take a few minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
